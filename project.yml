# Generate the Xcode project with: xcodegen generate
# Before running on your own devices, set DEVELOPMENT_TEAM below (or pick a team in
# Xcode's Signing & Capabilities tab) and change BUNDLE_PREFIX to something unique.
name: FakeCall
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_PREFIX: com.example.fakecall
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FakeCall:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 来电
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: 通话接通时模拟真实通话的麦克风状态，并用于录制对方的声音。
        NSCameraUsageDescription: 微信视频来电时在背景显示前置摄像头画面。
        NSPhotoLibraryUsageDescription: 选择来电人的头像。
        CFBundleURLTypes:
          - CFBundleURLName: fakecall
            CFBundleURLSchemes: [fakecall]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FakeCallWatch
  FakeCallWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 来电
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
        WKBackgroundModes: [alarm]
        CFBundleURLTypes:
          - CFBundleURLName: fakecall-watch
            CFBundleURLSchemes: [fakecall-watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: FakeCallWatchWidgets
  FakeCallWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: 来电
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
